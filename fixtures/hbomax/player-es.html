<!-- Reduced observed HBO Max markup. No account, media URLs, SVG paths, or page scripts. -->
<div id="layer-root-player-screen">
  <div><div data-testid="playerContainer" dir="ltr">
    <video data-testid="VideoElement"></video>
    <div><div tabindex="0" id="overlay-root" data-testid="overlay-root" role="group" aria-label="video player">
      <div data-testid="up_next" style="display: inline; visibility: hidden;"></div>
      <div data-testid="skip" style="display: inline; visibility: visible;">
        <div><div><button data-testid="player-ux-skip-button" aria-label="Omitir intro"><svg role="img"></svg><span>Omitir intro</span></button></div></div>
      </div>
      <input type="range" step="0.1" data-testid="player-ux-scrubber-position">
      <button data-testid="player-ux-play-pause-button" data-focusid="playback_play" aria-label="Pausar" title="Pausar (Espacio)"></button>
      <button aria-disabled="false" data-testid="player-ux-skip-back-button" aria-label="Retroceder 10 segundos"></button>
      <button aria-disabled="false" data-testid="player-ux-skip-forward-button" aria-label="Se adelantó 10 segundos"></button>
      <button data-testid="player-ux-volume-button" aria-label="Volumen 100%"></button>
      <button data-testid="player-ux-track-selector-button" aria-label="Configuración de Audio y Subtítulos"></button>
      <button data-testid="player-ux-fullscreen-button" aria-label="Pantalla completa"></button>
    </div></div>
  </div></div>
</div>
