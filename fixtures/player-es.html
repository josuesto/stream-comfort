<!-- Reduced from observed live control markup. CSS classes and SVG paths omitted.
     Video source, episode title, user details and all site scripts omitted. -->
<div id="player-container" class="player-container" aria-label="Reproductor de vídeo">
  <div class="bitmovinplayer-container aspect-16x9"><video id="bitmovinplayer-video-null" playsinline disablepictureinpicture></video></div>
  <div data-testid="player-controls-root">
    <button type="button" aria-label="Saltar intro" aria-hidden="false" tabindex="0"><span>Saltar intro</span><span><svg aria-hidden="true" data-testid="skip-intro-icon"></svg></span></button>
    <div data-testid="bottom-controls-autohide">
      <input type="range" class="timeline-slider" aria-label="Línea de tiempo del vídeo" min="0" max="1" step="0.25">
      <button type="button" aria-label="Pausa" data-testid="play-pause-button"></button>
      <button type="button" aria-label="Siguiente episodio" data-testid="next-episode-button"><svg data-testid="next-episode-icon" aria-hidden="true"></svg></button>
    </div>
  </div>
</div>
